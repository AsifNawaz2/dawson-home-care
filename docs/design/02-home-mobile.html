  </div>
</section>

<!-- ============ 1. HERO ============ -->

  <sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">
    <p style="display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:0 16px;border-radius:999px;background:#EEF6DC;color:#4A7309;font-size:16px;font-weight:600"><span aria-hidden="true" style="width:10px;height:10px;border-radius:50%;background:#4A7309;flex:none"></span>Office open now</p>
  </sc-if>
  <sc-if value="{{isClosed}}" hint-placeholder-val="{{false}}">
    <p style="display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:0 16px;border-radius:999px;background:#EEE9F8;color:#2A1856;font-size:16px;font-weight:600"><svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>Office closed · Opens Monday at 8 AM</p>
  </sc-if>
  <sc-if value="{{heroOwner}}" hint-placeholder-val="{{true}}">
    <h1 id="hero-title" class="ff" style="margin-top:20px;font-size:48px;line-height:1.03;color:#2A1856">Care that feels like <span style="color:#C25BD9">family</span> — from an owner who meets yours.</h1>
  </sc-if>
  <sc-if value="{{heroFamily}}" hint-placeholder-val="{{false}}">
    <h1 id="hero-title" class="ff" style="margin-top:20px;font-size:48px;line-height:1.03;color:#2A1856">Care that feels like <span style="color:#C25BD9">family</span> — because it's run by one.</h1>
  </sc-if>
  <p class="lead" style="margin-top:16px">Help at home for a few hours or around the clock, 7 days a week. Local. Owner-run. Here since 2002.</p>
  <img src="images/hero-caregivers.jpg" alt="Two smiling Dawson caregivers in lavender uniforms, standing in a family's living room." style="display:block;margin-top:28px;width:100%;height:280px;object-fit:cover;object-position:50% 30%;border-radius:20px">
  <div style="margin-top:28px;display:flex;flex-direction:column;gap:12px">
    <a class="btn btn-primary btn-full" href="/free-assessment"><sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">Get a Free Care Assessment</sc-if><sc-if value="{{isClosed}}" hint-placeholder-val="{{false}}">Request a Callback</sc-if></a>
    <a class="btn btn-secondary btn-full" href="tel:+18433793321">
      <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Call (843) 379-3321
    </a>
    <p class="sm muted" style="text-align:center">Free visit at home. No obligation.</p>
  </div>
  <ul style="list-style:none;padding:20px 0 0;margin-top:20px;border-top:1px solid #E7E1EE;display:flex;flex-direction:column;gap:10px;color:#2A1856;font-size:16px;font-weight:500">
    <li style="display:flex;align-items:center;gap:10px"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E3BA8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>Caring for families since 2002.</li>
    <li style="display:flex;align-items:center;gap:10px"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E3BA8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>Owner-run.</li>
    <li style="display:flex;align-items:center;gap:10px"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E3BA8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>Care available 24/7</li>
  </ul>
</section>

<!-- ============ 2. THE MOMENT ============ -->
<section id="the-moment" aria-labelledby="moment-title" style="background:#FFFFFF">
  <div class="pad"><a class="skip sr-only" href="#how-we-help">Skip to how we help</a></div>
  <ol class="sr-only">
    <li>Mom missed her pills again.</li>
    <li>Dad fell getting out of the shower.</li>
    <li>She hasn't left the house in a week.</li>
    <li>You live three hours away.</li>
  </ol>
  <div data-el="mt-track" style="position:relative;height:1520px">
    <div style="position:sticky;top:0;height:844px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:72px 20px 72px">
      <p class="eyebrow mw" data-mt-w="0">01 — The moment</p>
      <h2 id="moment-title" style="display:flex;flex-direction:column;align-items:center;gap:4px;color:#2A1856">
        <span style="font-family:'Poppins',sans-serif;font-weight:300;font-size:32px;line-height:1.15;letter-spacing:-0.01em"><span class="mw" data-mt-w="1">It</span> <span class="mw" data-mt-w="2">usually</span> <span class="mw" data-mt-w="3">starts</span> <span class="mw" data-mt-w="4">with</span></span>
        <span class="mw ff" data-mt-w="5" style="font-size:76px;line-height:1;color:#2A1856;white-space:nowrap">a <span style="color:#C25BD9">moment.</span></span>
      </h2>
    </div>
  </div>
  <div data-el="st-track" style="position:relative;height:3720px">
    <div aria-hidden="true" style="position:sticky;top:0;height:844px;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:88px 20px 96px">
      <div style="position:relative;width:350px;height:350px;border-radius:24px;overflow:hidden;background:#EEE9F8;flex:none">
        <img class="st-img" data-st-img="0" data-active="true" src="images/moment-1.jpg" alt="">
        <img class="st-img" data-st-img="1" src="images/moment-2.jpg" alt="">
        <img class="st-img" data-st-img="2" src="images/moment-3.jpg" alt="">
        <img class="st-img" data-st-img="3" src="images/moment-4.jpg" alt="">
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;min-height:150px">
        <p class="st-line" data-st-line="0" data-state="current"><span data-st-text="0" data-text="Mom missed her pills again."></span><span class="caret"></span></p>
        <p class="st-line" data-st-line="1" data-state="future"><span data-st-text="1" data-text="Dad fell getting out of the shower."></span><span class="caret"></span></p>
        <p class="st-line" data-st-line="2" data-state="future"><span data-st-text="2" data-text="She hasn't left the house in a week."></span><span class="caret"></span></p>
        <p class="st-line" data-st-line="3" data-state="future"><span data-st-text="3" data-text="You live three hours away."></span><span class="caret"></span></p>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="tick" data-st-tick="0" data-on="true"></span><span class="tick" data-st-tick="1"></span><span class="tick" data-st-tick="2"></span><span class="tick" data-st-tick="3"></span>
        <span data-el="st-count" class="sm" style="font-weight:600;color:#5B5670;margin-left:6px">1 of 4</span>
      </div>
    </div>
  </div>
  <div class="pad" style="padding-bottom:88px">
    <div style="padding-top:48px;border-top:1px solid #E7E1EE;display:flex;flex-direction:column;gap:16px;align-items:flex-start">
      <p class="dl" style="color:#2A1856">You don't have to figure this out alone.</p>
      <p class="lead">We've helped Lowcountry families through moments like these since 2002.</p>
      <a class="link" href="#how-we-help">See how we can help ↓</a>
    </div>
  </div>
</section>

<!-- ============ 4. FIND THE RIGHT CARE ============ -->
<section id="find-care" aria-labelledby="quiz-title" class="pad" style="padding-top:80px;padding-bottom:80px;background:#F6EAFB">
  <div style="display:flex;flex-direction:column;gap:12px;align-items:flex-start">
    <p class="eyebrow">03 — Find the right care</p>
    <h2 id="quiz-title" class="h2">Not sure what you need?</h2>
    <p class="lead">Most families aren't. Answer five quick questions and we'll suggest a plan.</p>
    <p class="sm muted" style="display:flex;align-items:center;gap:8px"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E3BA8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>About 1 minute · No email needed</p>
  </div>
  <div style="margin-top:24px">
    <div style="background:#FFFFFF;border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;gap:20px">
      <sc-if value="{{qz.asking}}" hint-placeholder-val="{{true}}">
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;min-height:48px">
            <p class="sm" aria-live="polite" style="font-weight:600;color:#2A1856">{{qz.progressText}}</p>
            <sc-if value="{{qz.canBack}}" hint-placeholder-val="{{false}}">
              <button type="button" class="link sm" onClick="{{qz.back}}" style="background:none;border:0;padding:0;cursor:pointer;font-family:inherit;font-size:16px">← Back</button>

<!-- ============ 13. QUESTIONS ============ -->
<section aria-labelledby="faq-title" class="pad" style="padding-top:88px;padding-bottom:88px">
  <p class="eyebrow">12 — Questions</p>
  <h2 id="faq-title" class="h2" style="margin-top:12px">Questions families ask us.</h2>
  <div style="margin-top:24px;border-top:1px solid #E7E1EE">
    <div style="border-bottom:1px solid #E7E1EE">
      <h3><button type="button" class="faq-q" aria-expanded="{{fq0.exp}}" aria-controls="mfaq-a0" onClick="{{fq0.toggle}}">What's the difference between home care and home health?<svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transform:{{fq0.rot}};transition:transform 360ms"><path d="m6 9 6 6 6-6"></path></svg></button></h3>
      <sc-if value="{{fq0.open}}" hint-placeholder-val="{{true}}"><div id="mfaq-a0" style="padding:0 0 24px"><p>Home care is non-medical help at home: bathing, dressing, meals, housekeeping, company and medication reminders. That's what we do. Home health is medical care from nurses or therapists, usually ordered by a doctor. Many families use both, and we're happy to work alongside your home health team.</p></div></sc-if>
    </div>
    <div style="border-bottom:1px solid #E7E1EE">
      <h3><button type="button" class="faq-q" aria-expanded="{{fq1.exp}}" aria-controls="mfaq-a1" onClick="{{fq1.toggle}}">How much does home care cost?<svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transform:{{fq1.rot}};transition:transform 360ms"><path d="m6 9 6 6 6-6"></path></svg></button></h3>
      <sc-if value="{{fq1.open}}" hint-placeholder-val="{{false}}"><div id="mfaq-a1" style="padding:0 0 24px"><p>It depends on how many hours of help you need. Use our cost estimator for a rough range. Your exact rate is set at your free assessment.</p></div></sc-if>
    </div>
    <div style="border-bottom:1px solid #E7E1EE">
      <h3><button type="button" class="faq-q" aria-expanded="{{fq2.exp}}" aria-controls="mfaq-a2" onClick="{{fq2.toggle}}">Does Medicare pay for home care?<svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transform:{{fq2.rot}};transition:transform 360ms"><path d="m6 9 6 6 6-6"></path></svg></button></h3>
      <sc-if value="{{fq2.open}}" hint-placeholder-val="{{false}}"><div id="mfaq-a2" style="padding:0 0 24px"><p>Usually not. Medicare generally doesn't cover non-medical home care. Some families use long-term care insurance, VA benefits or Medicaid waiver programs. Ask us which might apply to you.</p></div></sc-if>
    </div>
    <div style="border-bottom:1px solid #E7E1EE">
      <h3><button type="button" class="faq-q" aria-expanded="{{fq3.exp}}" aria-controls="mfaq-a3" onClick="{{fq3.toggle}}">Can you help at night or on weekends?<svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transform:{{fq3.rot}};transition:transform 360ms"><path d="m6 9 6 6 6-6"></path></svg></button></h3>
      <sc-if value="{{fq3.open}}" hint-placeholder-val="{{false}}"><div id="mfaq-a3" style="padding:0 0 24px"><p>Yes. Care is available 24 hours a day, 7 days a week — a few hours or around the clock. Our office is open Monday to Friday, 8 AM to 5 PM.</p></div></sc-if>
    </div>
    <div style="border-bottom:1px solid #E7E1EE">
      <h3><button type="button" class="faq-q" aria-expanded="{{fq4.exp}}" aria-controls="mfaq-a4" onClick="{{fq4.toggle}}">Who will come to my loved one's home?<svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transform:{{fq4.rot}};transition:transform 360ms"><path d="m6 9 6 6 6-6"></path></svg></button></h3>
      <sc-if value="{{fq4.open}}" hint-placeholder-val="{{false}}"><div id="mfaq-a4" style="padding:0 0 24px"><p>An experienced Dawson caregiver chosen for your loved one's needs and schedule. Our team includes Certified Nursing Assistants, and our owner stays involved in every client's care.</p></div></sc-if>
