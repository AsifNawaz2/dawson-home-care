<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Care at Home in Beaufort, SC | Dawson &amp; Dawson</title>

<link rel="stylesheet" href="css/03-personal-care-desktop.css">
</head>
<body>
<div id="app"></div>
<template id="dc-template"><div class="dd" id="top" ref="{{rootRef}}" style="min-height:100vh;display:flex;flex-direction:column;background:#FBF8F3">

<!-- ============ HEADER ============ -->
<header style="position:sticky;top:0;left:0;right:0;z-index:60;background:#FBF8F3;border-bottom:1px solid #E7E1EE">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:32px;min-height:112px">
    <a href="/" aria-label="Dawson &amp; Dawson Home Care — home" style="display:inline-flex;align-items:center;text-decoration:none;min-height:56px">
      <img src="images/logo.png" alt="" width="169" height="92" style="display:block;width:169px;height:auto">
    </a>
    <nav aria-label="Main" style="display:flex;align-items:center;gap:32px">
      <a class="navlink" href="/care" aria-current="page">Care services</a>
      <a class="navlink" href="/how-it-works">How it works</a>
      <a class="navlink" href="/paying-for-care">Paying for care</a>
      <a class="navlink" href="/areas-we-serve">Areas we serve</a>
      <a class="navlink" href="/about">Our story</a>
    </nav>
    <a class="btn btn-secondary" href="tel:+18433793321" data-cursor-label="Call"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Call (843) 379-3321</a>
  </div>
</header>

<main style="flex:none">

<!-- ============ BREADCRUMB + HERO ============ -->
<section aria-labelledby="pc-title" style="position:relative;overflow:hidden">
  <div class="wrap">
    <nav aria-label="Breadcrumb" class="crumbs sm" style="padding-top:16px">
      <ol style="list-style:none;padding:0;display:flex;align-items:center;gap:10px">
        <li><a href="/">Home</a></li>
        <li aria-hidden="true" style="color:#5B5670">›</li>
        <li><a href="/care">Care</a></li>
        <li aria-hidden="true" style="color:#5B5670">›</li>
        <li><span aria-current="page" style="color:#2A1856;font-weight:600">Personal Care</span></li>
      </ol>
    </nav>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 620px;gap:48px;align-items:center;padding:24px 0 80px">
      <div style="display:flex;flex-direction:column;gap:20px;align-items:flex-start">
        <div style="display:flex;flex-direction:column;gap:6px">
          <p class="eyebrow">Care services</p>
          <p class="sm muted">Also called: help with daily living (ADLs)</p>
        </div>
        <h1 id="pc-title" class="ff" style="font-size:96px;line-height:1.0;color:#2A1856">Personal care, done with <span style="color:#C25BD9">dignity</span>.</h1>
        <p class="lead" style="max-width:560px">Gentle help with bathing, dressing, the bathroom and moving around the house — so your loved one can stay home and stay themselves.</p>
        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px">
          <a class="btn btn-primary" href="{{assessHref}}"><sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">Get a Free Care Assessment</sc-if><sc-if value="{{isClosed}}" hint-placeholder-val="{{false}}">Request a Callback</sc-if></a>
          <a class="btn btn-ghost" href="tel:+18433793321" data-cursor-label="Call"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Call (843) 379-3321</a>
        </div>
        <p class="sm muted">Free visit at home. No obligation.</p>
        <p style="margin-top:12px;padding-top:20px;border-top:1px solid #E7E1EE;display:flex;align-items:center;gap:14px;color:#2A1856;font-weight:600;font-size:17px"><span>Since 2002</span><span aria-hidden="true" style="color:#C25BD9">·</span><span>Owner-run</span><span aria-hidden="true" style="color:#C25BD9">·</span><span>Care 24/7</span></p>
      </div>
      <figure class="hero-vid" style="position:relative;height:600px">
        <div style="position:absolute;left:0;top:10px"><div class="collage" style="transform:scale(0.94);transform-origin:0 0"><span class="c-panel" style="left:202px;top:38px;width:343px;height:564px"></span><div class="cv" data-playing="false" style="left:413px;top:110px;z-index:1"><video data-hv="" src="videos/personal-care-1.mp4" poster="images/poster-personal-care-1.jpg" muted="{{yes}}" loop="{{yes}}" autoplay="" playsinline="" preload="metadata" aria-hidden="true"></video><span class="cv-play" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg></span></div><div class="cv" data-playing="false" style="left:252px;top:183px;z-index:2"><video data-hv="" src="videos/personal-care-2.mp4" poster="images/poster-personal-care-2.jpg" muted="{{yes}}" loop="{{yes}}" autoplay="" playsinline="" preload="metadata" aria-hidden="true"></video><span class="cv-play" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg></span></div><div class="cv" data-playing="false" style="left:92px;top:38px;z-index:3"><video data-hv="" src="videos/personal-care-3.mp4" poster="images/poster-personal-care-3.jpg" muted="{{yes}}" loop="{{yes}}" autoplay="" playsinline="" preload="metadata" aria-hidden="true"></video><span class="cv-play" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF"><polygon points="7 4 20 12 7 20 7 4"></polygon></svg></span></div></div></div>
        <figcaption class="sr-only">A Dawson caregiver helping an older woman button her cardigan.</figcaption>
      </figure>
    </div>
  </div>
</section>

<!-- ============ 01 — IS THIS RIGHT FOR YOU ============ -->
<section id="right-for-you" aria-labelledby="fit-title" style="background:#F6EAFB;padding:96px 0">
  <div class="wrap" style="display:grid;grid-template-columns:420px minmax(0,1fr);gap:80px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:16px;position:sticky;top:152px">
      <p class="eyebrow">01 — Is this right for you?</p>
      <h2 id="fit-title" class="h2" style="font-size:72px">This helps if…</h2>
      <p class="lead">Tick any that sound familiar.</p>
      <p style="margin-top:16px">Not sure this is the one? <a class="link" href="/find-care" data-cursor-label="Open" style="display:inline;min-height:0">Take the 1-minute quiz</a></p>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:14px">
        <legend class="sr-only">This helps if… Tick any that sound familiar.</legend>
        <sc-for list="{{checks}}" as="c" hint-placeholder-count="5">
          <label class="chk" data-on="{{c.on}}">
            <input type="checkbox" id="{{c.id}}" checked="{{c.checked}}" onChange="{{c.toggle}}">
            <span class="box" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C0F3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19.5 7"></path></svg></span>
            <span>{{c.label}}</span>
          </label>
        </sc-for>
      </fieldset>
      <div aria-live="polite" style="min-height:8px">
        <sc-if value="{{hasTicks}}" hint-placeholder-val="{{false}}">
          <div class="result" data-surface="dark" style="margin-top:12px;background:#2A1856;border-radius:20px;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px">
            <p style="color:#FFFFFF;font-weight:600;font-size:20px;max-width:520px">{{resultText}}</p>
            <a class="btn btn-primary" href="{{needsHref}}" style="flex:none"><sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">Get a Free Care Assessment</sc-if><sc-if value="{{isClosed}}" hint-placeholder-val="{{false}}">Request a Callback</sc-if></a>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</section>

<!-- ============ 02 — WHAT'S INCLUDED ============ -->
<section aria-labelledby="inc-title" style="padding:96px 0">
  <div class="wrap">
    <div style="display:flex;flex-direction:column;gap:16px">
      <p class="eyebrow">02 — What's included</p>
      <h2 id="inc-title" class="h2">What we help with.</h2>
    </div>
    <ul style="list-style:none;padding:0;margin-top:48px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px">
      <li class="inc"><span class="ic3d" aria-hidden="true"><svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="#2A1856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="27" width="34" height="13" rx="3" fill="#F6EAFB"></rect><rect x="10" y="15" width="28" height="12" rx="3" fill="#C25BD9"></rect><path d="M10 21h28"></path><path d="M13 33h22"></path><rect x="13" y="7" width="22" height="8" rx="3" fill="#F6EAFB"></rect></svg></span><h3 class="h3">Bathing &amp; showering</h3><p>Washing, drying and getting in and out of the tub or shower safely.</p></li>
      <li class="inc"><span class="ic3d" aria-hidden="true"><svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="#2A1856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="8" width="11" height="32" rx="3" fill="#F6EAFB"></rect><path d="M18 13h5M18 18h5M18 23h5M18 28h5M18 33h5"></path><path d="M33 40V24"></path><rect x="27" y="8" width="14" height="10" rx="2.5" fill="#C25BD9"></rect><path d="M29 18v4h8v-4"></path></svg></span><h3 class="h3">Grooming</h3><p>Shaving, brushing teeth, hair care — ready for the day.</p></li>
      <li class="inc"><span class="ic3d" aria-hidden="true"><svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="#2A1856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 8 12l-3 16 6 2 2-8v19h22V22l2 8 6-2-3-16-9-5c-1 3-3.5 5-7 5s-6-2-7-5Z" fill="#F6EAFB"></path><path d="M17 7 24 22 31 7"></path><path d="M24 22v19"></path><circle cx="27.5" cy="27" r="1.6" fill="#C25BD9" stroke="none"></circle><circle cx="27.5" cy="33" r="1.6" fill="#C25BD9" stroke="none"></circle><circle cx="27.5" cy="39" r="1.6" fill="#C25BD9" stroke="none"></circle></svg></span><h3 class="h3">Dressing</h3><p>Buttons, zippers, shoes and socks. They choose the outfit.</p></li>
      <li class="inc"><span class="ic3d" aria-hidden="true"><svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="#2A1856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="5" width="26" height="38" rx="2" fill="#F6EAFB"></rect><path d="M6 43h36"></path><circle cx="31" cy="25" r="1.8" fill="#2A1856"></circle><circle cx="24" cy="14" r="4.5" fill="#C25BD9"></circle></svg></span><h3 class="h3">Using the bathroom</h3><p>Toileting and continence care, handled calmly and privately.</p></li>
      <li class="inc"><span class="ic3d" aria-hidden="true"><svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="#2A1856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="26" r="15" fill="#F6EAFB"></circle><circle cx="21" cy="26" r="9" fill="#FFFFFF"></circle><path d="M41 10v32"></path><path d="M41 10c-3 0-4.5 3-4.5 7s1.5 6 4.5 6" fill="#C25BD9"></path></svg></span><h3 class="h3">Mealtimes</h3><p>Help eating, from the first bite to the last, at their own pace.</p></li>
      <li class="inc"><span class="ic3d" aria-hidden="true"><svg width="56" height="56" viewBox="0 0 48 48" fill="none" stroke="#2A1856" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 10h20"></path><path d="M14 10 10 40M34 10l4 30"></path><path d="M12 24h24"></path><rect x="11" y="7" width="7" height="6" rx="2" fill="#C25BD9"></rect><rect x="30" y="7" width="7" height="6" rx="2" fill="#C25BD9"></rect><circle cx="10" cy="41" r="3" fill="#F6EAFB"></circle><circle cx="38" cy="41" r="3" fill="#F6EAFB"></circle></svg></span><h3 class="h3">Moving safely</h3><p>Bed to chair, chair to wheelchair, room to room — a steady hand every step.</p></li>
    </ul>
    <aside aria-labelledby="not-inc" style="margin-top:32px;border:1.5px solid #5B5670;border-radius:20px;padding:28px 32px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:20px;align-items:start;max-width:960px">
      <span aria-hidden="true" style="width:56px;height:56px;border-radius:16px;background:#EEE9F8;display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span>
      <div style="display:flex;flex-direction:column;gap:6px">
        <h3 id="not-inc" class="h3" style="font-size:24px">What Personal Care doesn't include</h3>
        <p>All our care is non-medical. We don't give injections, change wound dressings or provide nursing. If your loved one needs that, we're happy to work alongside your home health or hospice team.</p>
      </div>
    </aside>
  </div>
</section>

<!-- ============ 03 — A DAY WITH DAWSON ============ -->
<section aria-labelledby="day-title" style="background:#FFFFFF;padding:96px 0">
  <div class="wrap" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:96px;align-items:start">
    <div style="position:sticky;top:152px;display:flex;flex-direction:column;gap:16px">
      <p class="eyebrow">03 — A day with Dawson</p>
      <h2 id="day-title" class="h2">What a day of personal care can look like.</h2>
      <p class="lead">An example with a morning and an evening visit. Every plan is built around your loved one.</p>
      <div class="sky" data-el="sky" aria-hidden="true" style="margin-top:24px;background:{{skyBg}}">
        <svg viewBox="0 0 560 420" width="100%" height="360" preserveAspectRatio="xMidYMax meet" style="position:absolute;inset:0">
          <path d="M40 360 A240 240 0 0 1 520 360" fill="none" stroke="{{skyArc}}" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round"></path>
          <line x1="24" y1="360" x2="536" y2="360" stroke="{{skyArc}}" stroke-width="2"></line>
          <g class="sky-body" data-el="sky-body" style="transform:translate({{skyX}}px,{{skyY}}px)">
            <g class="sun" style="opacity:{{sunOp}}"><circle r="34" fill="#94C723"></circle><circle r="52" fill="none" stroke="#94C723" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"></circle></g>
            <g class="moon" style="opacity:{{moonOp}}"><circle r="34" fill="#F6EAFB"></circle><circle cx="14" cy="-10" r="30" fill="#2A1856"></circle></g>
          </g>
        </svg>
        <div style="position:absolute;left:32px;top:24px;display:flex;flex-direction:column;gap:2px">
          <p data-el="sky-time" class="ff" style="font-size:60px;line-height:1;color:{{skyInk}}">{{skyTime}}</p>
          <p data-el="sky-title" style="font-weight:600;font-size:20px;color:{{skyInk}}">{{skyTitle}}</p>
        </div>
      </div>
    </div>
    <ol data-el="day" style="list-style:none;padding:0;position:relative;padding-top:8px">
      <span aria-hidden="true" style="position:absolute;left:35px;top:44px;bottom:100px;width:3px;border-radius:999px;background:#EEE9F8"></span>
      <span aria-hidden="true" data-el="day-fill" style="position:absolute;left:35px;top:44px;width:3px;height:{{dayFillH}}px;border-radius:999px;background:#C25BD9;box-shadow:0 0 12px 2px rgba(194,91,217,0.55)"></span>
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
        <li class="day-step" data-day-step="{{s.i}}" data-on="{{s.on}}" data-cur="{{s.cur}}">
          <span class="day-dot" aria-hidden="true">
            <sc-if value="{{s.isSun}}" hint-placeholder-val="{{true}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg></sc-if>
            <sc-if value="{{s.isMoon}}" hint-placeholder-val="{{false}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></sc-if>
          </span>
          <div style="display:flex;flex-direction:column;gap:4px;padding-top:2px">
            <time datetime="{{s.dt}}" style="font-weight:700;color:#8E3BA8;font-size:17px;letter-spacing:0.04em">{{s.time}}</time>
            <h3 class="h3">{{s.title}}</h3>
            <p>{{s.line}}</p>
          </div>
        </li>
      </sc-for>
    </ol>
  </div>
</section>

<!-- ============ 04 — SAFE AND DIGNIFIED ============ -->
<section aria-labelledby="safe-title" data-surface="dark" data-cursor-theme="dark" style="background:#1C0F3D;padding:104px 0 96px;position:relative;overflow:hidden">
  <svg aria-hidden="true" focusable="false" viewBox="0 0 1440 80" width="1440" height="80" preserveAspectRatio="none" style="position:absolute;left:0;top:40px;width:100%;height:80px"><path d="M0 40 H1000 L1014 30 L1026 40 H1038 L1058 6 L1080 74 L1098 24 L1110 40 H1440" fill="none" stroke="#C25BD9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path></svg>
  <div class="wrap" style="position:relative">
    <div style="display:flex;flex-direction:column;gap:16px;max-width:760px">
      <p class="eyebrow">04 — Safe and dignified</p>
      <h2 id="safe-title" class="h2" style="color:#FFFFFF">Help that never feels like a takeover.</h2>
    </div>
    <ol style="list-style:none;padding:0;margin-top:48px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px">
      <li style="display:flex;flex-direction:column;gap:14px;padding-top:28px;border-top:2px solid #4B2E91">
        <span aria-hidden="true" class="ff" style="font-size:64px;line-height:1;color:#C25BD9">01</span>
        <h3 class="h3" style="color:#FFFFFF">Their way, at their pace</h3>
        <p style="color:#EEE9F8">We ask before we help, and let your loved one do what they can. Doors closed, towels ready, privacy first.</p>
      </li>
      <li style="display:flex;flex-direction:column;gap:14px;padding-top:28px;border-top:2px solid #4B2E91">
        <span aria-hidden="true" class="ff" style="font-size:64px;line-height:1;color:#C25BD9">02</span>
        <h3 class="h3" style="color:#FFFFFF">Planned at home, by the owner</h3>
        <p style="color:#EEE9F8">Our owner visits first, sees how the home is set up and builds the plan with you — down to how they like their mornings.</p>
      </li>
      <li style="display:flex;flex-direction:column;gap:14px;padding-top:28px;border-top:2px solid #4B2E91">
        <span aria-hidden="true" class="ff" style="font-size:64px;line-height:1;color:#C25BD9">03</span>
        <h3 class="h3" style="color:#FFFFFF">Experienced hands, always checked on</h3>
        <p style="color:#EEE9F8">Our caregivers are experienced, and our team includes Certified Nursing Assistants. We follow up regularly and adjust the plan as needs change.</p>
      </li>
    </ol>
  </div>
</section>

<!-- ============ 05 — PAIRS WELL WITH + 06 — COST ============ -->
<div style="padding:96px 0">
  <div class="wrap" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:stretch">
    <section aria-labelledby="pairs-title" style="display:flex;flex-direction:column">
      <div style="display:flex;flex-direction:column;gap:16px">
        <p class="eyebrow">05 — Pairs well with</p>
        <h2 id="pairs-title" class="h2" style="font-size:48px">Pairs well with.</h2>
      </div>
      <ul style="list-style:none;padding:0;margin-top:32px;display:flex;flex-direction:column;gap:20px;flex:1">
        <li style="flex:1;display:flex">
          <a class="pair" href="/care/home-help" data-cursor-label="Open">
            <span style="overflow:hidden;display:block"><img src="images/poster-home-help-1.jpg" alt=""></span>
            <span style="padding:28px;display:flex;flex-direction:column;gap:8px;justify-content:center">
              <h3 class="h3">Home Help</h3>
              <span>Meals, laundry and medication reminders on the same visit.</span>
              <span class="link">See Home Help →</span>
            </span>
          </a>
        </li>
        <li style="flex:1;display:flex">
          <a class="pair" href="/care/24-hour-care" data-cursor-label="Open">
            <span style="overflow:hidden;display:block"><img src="images/poster-24-hour-care-1.jpg" alt=""></span>
            <span style="padding:28px;display:flex;flex-direction:column;gap:8px;justify-content:center">
              <h3 class="h3">24-Hour &amp; Overnight Care</h3>
              <span>When help is needed at night too.</span>
              <span class="link">See 24-Hour &amp; Overnight Care →</span>
            </span>
