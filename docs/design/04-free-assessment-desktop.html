<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free In-Home Care Assessment | Dawson &amp; Dawson, Beaufort SC</title>
<!-- Page settings can be changed with URL parameters: office=open|closed, showPending=true, startStep=1|2|3|4|5, banner=service page|quiz|resume|none, previewErrors=false -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/04-free-assessment-desktop.css">
</head>
<body>
<div id="app"></div>
<template id="dc-template"><div class="dd" id="top" ref="{{rootRef}}" style="min-height:100vh;display:flex;flex-direction:column;background:#FBF8F3">
<!-- ============ HEADER ============ -->
<header style="position:sticky;top:0;left:0;right:0;z-index:60;background:#FBF8F3;border-bottom:1px solid #E7E1EE">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:32px;min-height:112px">
    <a href="/" aria-label="Dawson &amp; Dawson Home Care — home" style="display:inline-flex;align-items:center;text-decoration:none;min-height:56px">
      <img src="images/logo.png" alt="" width="169" height="92" style="display:block;width:169px;height:auto">
    </a>
    <nav aria-label="Main" style="display:flex;align-items:center;gap:32px">
      <a class="navlink" href="/care">Care services</a>
      <a class="navlink" href="/how-it-works">How it works</a>
      <a class="navlink" href="/paying-for-care">Paying for care</a>
      <a class="navlink" href="/areas-we-serve">Areas we serve</a>
      <a class="navlink" href="/about">Our story</a>
    </nav>
    <a class="btn btn-secondary" href="tel:+18433793321" data-cursor-label="Call"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Call (843) 379-3321</a>
  </div>
</header>
<main style="flex:none">
  <div class="wrap">
    <nav aria-label="Breadcrumb" class="crumbs sm" style="padding-top:16px">
      <ol style="list-style:none;padding:0;display:flex;align-items:center;gap:10px">
        <li><a href="/">Home</a></li><li aria-hidden="true" style="color:#5B5670">›</li>
        <li><span aria-current="page" style="color:#2A1856;font-weight:600">Free Assessment</span></li>
      </ol>
    </nav>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:64px;align-items:start;padding-top:24px">
      <div style="display:flex;flex-direction:column;gap:24px;min-width:0">
        <section aria-labelledby="fa-title" style="display:flex;flex-direction:column;gap:16px;align-items:flex-start">
          <p class="eyebrow">Free care assessment</p>
          <h1 id="fa-title" class="ff" style="font-size:84px;line-height:1.0;color:#2A1856">A free visit at home, with our <span style="color:#C25BD9">owner</span>.</h1>
          <p class="lead" style="max-width:700px">Tell us a little about your family. We'll call you, then our owner comes to your loved one's home to plan care with you. Free, with no obligation.</p>
          <p class="sm" style="display:inline-flex;align-items:center;gap:8px;color:#2A1856;font-weight:600"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E3BA8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>About 2 minutes · 5 short steps</p>
          <sc-if value="{{isClosed}}" hint-placeholder-val="{{false}}"><p style="display:flex;gap:10px;align-items:flex-start;color:#2A1856"><svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:3px"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>Our office is closed right now. Send this and we'll call you first thing Monday at 8 AM.</p></sc-if>
        </section>

<sc-if value="{{bService}}" hint-placeholder-val="{{true}}">
  <div class="banner" aria-live="polite"><p><span aria-hidden="true" class="bdot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19.5 7"></path></svg></span>We've ticked <strong>Personal Care</strong> for you. Add anything else that might help.</p><button type="button" class="link sm" onClick="{{dismiss}}" style="background:none;border:0;padding:0 4px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;min-height:44px;flex:none">Dismiss</button></div>
</sc-if>
<sc-if value="{{bQuiz}}" hint-placeholder-val="{{false}}">
  <div class="banner" aria-live="polite"><p><span aria-hidden="true" class="bdot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19.5 7"></path></svg></span>We've filled in your quiz answers. Check them as you go.</p><button type="button" class="link sm" onClick="{{dismiss}}" style="background:none;border:0;padding:0 4px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;min-height:44px;flex:none">Dismiss</button></div>
</sc-if>
<sc-if value="{{bResume}}" hint-placeholder-val="{{false}}">
  <div class="banner" aria-live="polite" style="flex-wrap:wrap"><p style="font-weight:600;color:#2A1856">Welcome back. We kept your answers.</p><div style="display:flex;gap:12px;flex-wrap:wrap"><button type="button" class="btn btn-secondary" onClick="{{pickUp}}" style="min-height:48px;padding:0 20px">Pick up where I left off</button><button type="button" class="btn btn-ghost" onClick="{{startOver}}" style="min-height:48px;padding:0 20px">Start over</button></div></div>
</sc-if>

        <section aria-labelledby="step-h" style="scroll-margin-top:136px">
<div id="form" class="fcard" aria-labelledby="step-h" style="padding:44px 48px 40px">
  <sc-if value="{{f.sent}}" hint-placeholder-val="{{false}}">
    <div style="display:flex;flex-direction:column;gap:18px;align-items:flex-start">
      <span class="okmark" aria-hidden="true"><svg width="88" height="88" viewBox="0 0 88 88" fill="none"><circle cx="44" cy="44" r="40" fill="#EEF6DC" stroke="#94C723" stroke-width="3"></circle><path class="okpath" d="M8 46 H26 L32 38 L38 52 L44 46 L58 60 L76 30" stroke="#4A7309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      <h2 id="step-h" data-el="step-h" tabindex="-1" class="ff" style="font-size:56px;line-height:1.05;color:#2A1856">{{f.thanks}}</h2>
      <p class="lead">{{f.thanksLead}}</p>
      <sc-if value="{{f.thanksPending}}" hint-placeholder-val="{{false}}"><p class="sm muted">Most families hear from us within <span class="tbc">[Response time during office hours]</span>.</p></sc-if>
      <sc-if value="{{isClosed}}" hint-placeholder-val="{{false}}"><p class="sm muted">If someone is hurt or in danger, call 911.</p></sc-if>
      <div style="display:flex;flex-direction:column;gap:4px;padding-top:16px;border-top:1px solid #E7E1EE;align-self:stretch">
        <p><strong style="color:#2A1856">Care:</strong> 24 hours a day, 7 days a week</p>
        <p><strong style="color:#2A1856">Office:</strong> Monday–Friday, 8 AM–5 PM</p>
      </div>
      <a class="link" href="/">Back to the home page</a>
    </div>
  </sc-if>
  <sc-if value="{{f.notSent}}" hint-placeholder-val="{{true}}">
  <!-- progress -->
  <div style="display:flex;flex-direction:column;gap:10px">
    <p class="sm" style="font-weight:600;color:#2A1856">{{f.progress}}</p>
    <div aria-hidden="true" style="position:relative">
      <svg viewBox="0 0 500 40" width="100%" height="36" preserveAspectRatio="none" style="display:block;overflow:visible">
        <defs><clipPath id="pclip"><rect class="pfill" x="0" y="-10" width="500" height="60" style="transform:scaleX({{f.pfrac}})"></rect></clipPath></defs>
        <path d="M0 20 H36 L42 14 L47 20 H52 L58 4 L64 36 L69 12 L73 20 H136 L142 14 L147 20 H152 L158 4 L164 36 L169 12 L173 20 H236 L242 14 L247 20 H252 L258 4 L264 36 L269 12 L273 20 H336 L342 14 L347 20 H352 L358 4 L364 36 L369 12 L373 20 H436 L442 14 L447 20 H452 L458 4 L464 36 L469 12 L473 20 H500" fill="none" stroke="#E7E1EE" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
        <path clip-path="url(#pclip)" d="M0 20 H36 L42 14 L47 20 H52 L58 4 L64 36 L69 12 L73 20 H136 L142 14 L147 20 H152 L158 4 L164 36 L169 12 L173 20 H236 L242 14 L247 20 H252 L258 4 L264 36 L269 12 L273 20 H336 L342 14 L347 20 H352 L358 4 L364 36 L369 12 L373 20 H436 L442 14 L447 20 H452 L458 4 L464 36 L469 12 L473 20 H500" fill="none" stroke="#2A1856" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" style="filter:drop-shadow(0 0 4px rgba(194,91,217,0.7))"></path>
      </svg>
      <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:6px">
        <sc-for list="{{f.pnames}}" as="p" hint-placeholder-count="5"><span style="font-size:15px;font-weight:{{p.w}};color:{{p.c}};letter-spacing:0.02em">{{p.n}}</span></sc-for>
      </div>
    </div>
  </div>
  <p class="sr-only" aria-live="polite">{{f.announce}}</p>

  <!-- error summary -->
  <sc-if value="{{f.hasSummary}}" hint-placeholder-val="{{false}}">
    <div role="alert" data-el="esum" tabindex="-1" style="outline:none;margin-top:28px;background:#EEE9F8;border-left:4px solid #B42318;border-radius:12px;padding:18px 22px;display:flex;flex-direction:column;gap:8px">
      <p style="font-weight:700;color:#2A1856">{{f.summaryTitle}}</p>
      <ul style="padding-left:20px;display:flex;flex-direction:column;gap:4px">
        <sc-for list="{{f.summary}}" as="e" hint-placeholder-count="1"><li><a href="{{e.href}}" onClick="{{e.go}}" style="color:#B42318;font-weight:500;text-decoration:underline;text-underline-offset:3px">{{e.msg}}</a></li></sc-for>
      </ul>
    </div>
  </sc-if>

  <!-- ===== STEP 1 ===== -->
  <sc-if value="{{f.s1}}" hint-placeholder-val="{{false}}">
    <div class="fstep" style="margin-top:28px">
      <h2 id="step-h" data-el="step-h" tabindex="-1" class="sh">Who needs care?</h2>
      <fieldset class="fs" aria-describedby="{{f.err.care_for.dby}}">
        <legend class="lbl">Who is the care for? (required)</legend>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
          <sc-for list="{{f.care}}" as="o" hint-placeholder-count="4">
            <label class="opt" data-on="{{o.on}}" data-err="{{f.err.care_for.on}}">
              <input type="radio" name="care_for" id="{{o.id}}" checked="{{o.on}}" onChange="{{o.pick}}">
              <span class="oic" aria-hidden="true" style="background:{{o.bg}}">
                <sc-if value="{{o.i0}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></sc-if>
                <sc-if value="{{o.i1}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></sc-if>
                <sc-if value="{{o.i2}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg></sc-if>
                <sc-if value="{{o.i3}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6"></path><path d="M22 11h-6"></path></svg></sc-if>
              </span>
              <span class="otl">{{o.label}}</span>
              <span class="ock" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19.5 7"></path></svg></span>
            </label>
          </sc-for>
        </div>
        <sc-if value="{{f.err.care_for.on}}" hint-placeholder-val="{{false}}"><p id="care_for-err" class="emsg"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>{{f.err.care_for.msg}}</p></sc-if>
      </fieldset>
      <sc-if value="{{f.showLoved}}" hint-placeholder-val="{{true}}">
        <div class="fld">
          <label class="lbl" for="loved">Their first name</label>
          <p id="loved-help" class="help">So we know who we're talking about. First name is plenty.</p>
          <input id="loved" class="field" type="text" autocomplete="off" maxlength="40" value="{{f.a.loved}}" onChange="{{f.set.loved}}" aria-describedby="loved-help">
        </div>
      </sc-if>
      <div class="fld">
        <label class="lbl" for="town">{{f.townLabel}}</label>
        <p id="town-help" class="help">{{f.townHelp}}</p>
        <select id="town" class="field" value="{{f.a.town}}" onChange="{{f.set.town}}" onBlur="{{f.blur.town}}" aria-invalid="{{f.err.town.inv}}" aria-describedby="town-help {{f.err.town.dby}}" style="border:{{f.err.town.border}}">
          <option value="">Choose a town</option>
          <optgroup label="Near our office"><option value="near" disabled="{{yes}}">[Towns from areas.ts — to confirm]</option></optgroup>
          <optgroup label="Extended service area"><option value="ext" disabled="{{yes}}">[Towns from areas.ts — to confirm]</option></optgroup>
          <option value="other">Somewhere else</option>
          <option value="not-sure">Not sure</option>
        </select>
        <sc-if value="{{f.err.town.on}}" hint-placeholder-val="{{false}}"><p id="town-err" class="emsg"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>{{f.err.town.msg}}</p></sc-if>
      </div>
      <sc-if value="{{f.showOther}}" hint-placeholder-val="{{false}}">
        <div class="fld">
          <label class="lbl" for="town_other">Which town?</label>
          <p id="town_other-help" class="help">Type the town name. We'll check when we talk.</p>
          <input id="town_other" class="field" type="text" autocomplete="address-level2" maxlength="60" value="{{f.a.town_other}}" onChange="{{f.set.town_other}}" aria-describedby="town_other-help">
        </div>
      </sc-if>
    </div>
  </sc-if>

  <!-- ===== STEP 2 ===== -->
  <sc-if value="{{f.s2}}" hint-placeholder-val="{{true}}">
    <div class="fstep" style="margin-top:28px">
      <h2 id="step-h" data-el="step-h" tabindex="-1" class="sh">{{f.h2}}</h2>
      <fieldset class="fs" aria-describedby="services-help {{f.err.services.dby}}">
        <legend class="lbl">Choose all that might help. (required)</legend>
        <p id="services-help" class="help" style="margin-top:-4px">You can change your mind later. Most families combine two or three.</p>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px">
          <sc-for list="{{f.serv}}" as="o" hint-placeholder-count="6">
            <label class="opt opt-tall" data-on="{{o.on}}" data-err="{{f.err.services.on}}">
              <input type="checkbox" name="services" value="{{o.v}}" id="{{o.id}}" checked="{{o.on}}" onChange="{{o.pick}}">
              <span class="oic" aria-hidden="true">
                <sc-if value="{{o.iPC}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4 8 6"></path><path d="M17 19v2"></path><path d="M2 12h20"></path><path d="M7 19v2"></path><path d="M9 5 7.621 3.621A2.121 2.121 0 0 0 4 5v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"></path></svg></sc-if>
                <sc-if value="{{o.iHH}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></sc-if>
                <sc-if value="{{o.iCO}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg></sc-if>
                <sc-if value="{{o.iRE}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v2"></path><path d="M14 2v2"></path><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"></path><path d="M6 2v2"></path></svg></sc-if>
                <sc-if value="{{o.iTF}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></sc-if>
                <sc-if value="{{o.iHS}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></sc-if>
                <sc-if value="{{o.iNS}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></sc-if>
              </span>
              <span style="flex:1;display:flex;flex-direction:column;gap:2px">
                <span class="otl">{{o.title}}</span>
                <span class="osub"><sc-if value="{{o.hasTbc}}" hint-placeholder-val="{{false}}"><span class="tbc">{{o.tbc}}</span> </sc-if>{{o.line}}</span>
              </span>
              <span class="ock" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19.5 7"></path></svg></span>
            </label>
          </sc-for>
        </div>
        <sc-if value="{{f.err.services.on}}" hint-placeholder-val="{{false}}"><p id="services-err" class="emsg"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>{{f.err.services.msg}}</p></sc-if>
      </fieldset>
      <p style="margin-top:4px"><a class="link" href="/find-care" data-cursor-label="Open" style="min-height:40px">Not sure? Take the 1-minute quiz</a> <span class="sm muted">Your answers here are saved.</span></p>
      <p class="sm muted">All our care is non-medical. We work alongside home health and hospice teams.</p>
    </div>
  </sc-if>

  <!-- ===== STEP 3 ===== -->
  <sc-if value="{{f.s3}}" hint-placeholder-val="{{false}}">
    <div class="fstep" style="margin-top:28px">
      <h2 id="step-h" data-el="step-h" tabindex="-1" class="sh">When, and how much help?</h2>
      <fieldset class="fs" aria-describedby="{{f.err.start.dby}}">
        <legend class="lbl">When would you like care to start? (required)</legend>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
          <sc-for list="{{f.start}}" as="o" hint-placeholder-count="4">
            <label class="opt opt-sm" data-on="{{o.on}}" data-err="{{f.err.start.on}}"><input type="radio" name="start_timing" id="{{o.id}}" checked="{{o.on}}" onChange="{{o.pick}}"><span class="rdot" aria-hidden="true"></span><span class="otl">{{o.label}}</span></label>
          </sc-for>
        </div>
