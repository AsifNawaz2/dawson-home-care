<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawson &amp; Dawson Home Care — Homepage (desktop)</title>
<!-- Page settings can be changed with URL parameters: office=open|closed, showPending=true, heroHeadline=owner|family-run -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/01-home-desktop.css">
</head>
<body>
<div id="app"></div>
<template id="dc-template"><div class="dd" id="top" ref="{{rootRef}}" style="min-height:100vh;display:flex;flex-direction:column;background:#FBF8F3">

<!-- ============ HEADER ============ -->
<header data-el="header" style="position:{{headerPos}};top:0;left:0;right:0;z-index:60;background:#FBF8F3;border-bottom:1px solid #E7E1EE;opacity:{{headerOpacity}}">
  <div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:32px;min-height:112px">
    <a href="#top" aria-label="Dawson &amp; Dawson Home Care — home" style="display:inline-flex;align-items:center;text-decoration:none;min-height:56px">
      <img data-el="header-logo" src="images/logo.png" alt="" width="169" height="92" style="display:block;width:169px;height:auto;opacity:{{headerOpacity}}">
    </a>
    <nav aria-label="Main" style="display:flex;align-items:center;gap:32px">
      <a class="navlink" href="/care">Care services</a>
      <a class="navlink" href="/how-it-works">How it works</a>
      <a class="navlink" href="/paying-for-care">Paying for care</a>
      <a class="navlink" href="/areas-we-serve">Areas we serve</a>
      <a class="navlink" href="/about">Our story</a>
    </nav>
    <a class="btn btn-secondary" href="tel:+18433793321" data-cursor-label="Call">
      <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.910a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      Call (843) 379-3321
    </a>
  </div>
</header>

<main style="flex:none">

<!-- ============ INTRO ANIMATION ============ -->
<section data-el="intro" aria-label="Dawson &amp; Dawson Home Care" style="position:relative;height:{{introH}}px;background:#FFFFFF;overflow:hidden">
  <sc-if value="{{live}}" hint-placeholder-val="{{false}}">
    <video data-el="intro-video" src="videos/intro-animation.mp4" poster="images/intro-end-frame.jpg" muted="{{yes}}" autoplay="" playsinline="" preload="auto" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#FFFFFF"></video>
  </sc-if>
  <sc-if value="{{notLive}}" hint-placeholder-val="{{true}}">
    <img src="images/intro-end-frame.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#FFFFFF">
  </sc-if>
  <div data-el="intro-hint" aria-hidden="true" style="opacity:{{hintOpacity}};position:absolute;left:0;right:0;bottom:32px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#2A1856;font-size:14px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;transition:opacity 500ms cubic-bezier(0.22,1,0.36,1)">
    <span class="mouse"></span>
    <span>Scroll</span>
    <svg class="hint-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E3BA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
  </div>
</section>

<!-- ============ 1. HERO ============ -->
<section aria-labelledby="hero-title" style="padding:{{heroPadTop}}px 0 112px">
  <div class="wrap">
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:64px;align-items:stretch">
      <div style="display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:28px">
        <sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">
          <p style="display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:0 18px;border-radius:999px;background:#EEF6DC;color:#4A7309;font-size:16px;font-weight:600">
            <span aria-hidden="true" style="width:10px;height:10px;border-radius:50%;background:#4A7309;flex:none"></span>Office open now
          </p>
        </sc-if>
        <sc-if value="{{isClosed}}" hint-placeholder-val="{{false}}">
          <p style="display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:0 18px;border-radius:999px;background:#EEE9F8;color:#2A1856;font-size:16px;font-weight:600">
            <svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>Office closed · Opens Monday at 8 AM
          </p>
        </sc-if>
        <sc-if value="{{heroOwner}}" hint-placeholder-val="{{true}}">
          <h1 id="hero-title" class="ff" style="font-size:72px;line-height:1.04;color:#2A1856">Care that feels like <span style="color:#C25BD9">family</span> — from an owner who meets yours.</h1>
        </sc-if>
        <sc-if value="{{heroFamily}}" hint-placeholder-val="{{false}}">
          <h1 id="hero-title" class="ff" style="font-size:72px;line-height:1.04;color:#2A1856">Care that feels like <span style="color:#C25BD9">family</span> — because it's run by one.</h1>
        </sc-if>
        <p class="lead" style="color:#1E1A2B">Help at home for a few hours or around the clock, 7 days a week. Local. Owner-run. Here since 2002.</p>
      </div>
      <figure style="position:relative;min-height:460px">
        <img src="images/hero-caregivers.jpg" alt="Two smiling Dawson caregivers in lavender uniforms, standing in a family's living room." style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;border-radius:24px;display:block">
      </figure>
    </div>
    <div style="margin-top:56px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center">
      <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">
        <a class="btn btn-primary" href="/free-assessment"><sc-if value="{{isOpen}}" hint-placeholder-val="{{true}}">Get a Free Care Assessment</sc-if><sc-if value="{{isClosed}}" hint-placeholder-val="{{false}}">Request a Callback</sc-if></a>
        <a class="btn btn-secondary" href="tel:+18433793321" data-cursor-label="Call">
          <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          Call (843) 379-3321
        </a>
      </div>
      <p class="sm muted">Free visit at home. No obligation.</p>
      <p style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 24px;padding-top:20px;border-top:1px solid #E7E1EE;color:#2A1856;font-size:16px;font-weight:500">
        <span style="display:inline-flex;align-items:center;gap:8px"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E3BA8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>Caring for families since 2002.</span>
        <span style="display:inline-flex;align-items:center;gap:8px"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E3BA8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>Owner-run.</span>
        <span style="display:inline-flex;align-items:center;gap:8px"><svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8E3BA8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>Care available 24/7</span>
      </p>
    </div>
  </div>
</section>

<!-- ============ 2. THE MOMENT ============ -->
<section id="the-moment" aria-labelledby="moment-title" style="background:#FFFFFF">
  <div class="wrap"><a class="skip sr-only" href="#how-we-help">Skip to how we help</a></div>
  <ol class="sr-only">
    <li>Mom missed her pills again.</li>
    <li>Dad fell getting out of the shower.</li>
    <li>She hasn't left the house in a week.</li>
    <li>You live three hours away.</li>
  </ol>

  <sc-if value="{{live}}" hint-placeholder-val="{{false}}">
    <div data-el="mt-track" style="position:relative;height:{{mtTrackH}}px">
      <div style="position:sticky;top:0;height:{{vh}}px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;padding:96px 80px 0">
        <p class="eyebrow mw" data-mt-w="0">01 — The moment</p>
        <h2 id="moment-title" style="display:flex;flex-direction:column;align-items:center;gap:8px;color:#2A1856">
          <span style="font-family:'Poppins',sans-serif;font-weight:300;font-size:64px;line-height:1.1;letter-spacing:-0.01em"><span class="mw" data-mt-w="1">It</span> <span class="mw" data-mt-w="2">usually</span> <span class="mw" data-mt-w="3">starts</span> <span class="mw" data-mt-w="4">with</span></span>
          <span class="mw ff" data-mt-w="5" style="font-size:168px;line-height:1;color:#2A1856">a <span style="color:#C25BD9">moment.</span></span>
        </h2>
      </div>
    </div>
    <div data-el="st-track" style="position:relative;height:{{stTrackH}}px">
      <div style="position:sticky;top:0;height:{{vh}}px;display:flex;align-items:center">
        <div class="wrap" aria-hidden="true" style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:80px;align-items:center;padding-top:72px">
          <div style="position:relative;width:{{stImgH}}px;height:{{stImgH}}px;border-radius:24px;overflow:hidden;background:#EEE9F8">
            <img class="st-img" data-st-img="0" data-active="true" src="images/moment-1.jpg" alt="">
            <img class="st-img" data-st-img="1" src="images/moment-2.jpg" alt="">
            <img class="st-img" data-st-img="2" src="images/moment-3.jpg" alt="">
            <img class="st-img" data-st-img="3" src="images/moment-4.jpg" alt="">
          </div>
          <div style="display:flex;flex-direction:column;gap:20px">
            <p class="st-line" data-st-line="0" data-state="current"><span data-st-text="0" data-text="Mom missed her pills again."></span><span class="caret"></span></p>
            <p class="st-line" data-st-line="1" data-state="future"><span data-st-text="1" data-text="Dad fell getting out of the shower."></span><span class="caret"></span></p>
            <p class="st-line" data-st-line="2" data-state="future"><span data-st-text="2" data-text="She hasn't left the house in a week."></span><span class="caret"></span></p>
            <p class="st-line" data-st-line="3" data-state="future"><span data-st-text="3" data-text="You live three hours away."></span><span class="caret"></span></p>
            <div style="display:flex;align-items:center;gap:16px;margin-top:24px">
              <span class="tick" data-st-tick="0" data-on="true"></span><span class="tick" data-st-tick="1"></span><span class="tick" data-st-tick="2"></span><span class="tick" data-st-tick="3"></span>
              <span data-el="st-count" class="sm" style="font-weight:600;color:#5B5670;margin-left:8px">1 of 4</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{notLive}}" hint-placeholder-val="{{true}}">
    <div class="wrap" style="padding-top:128px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center">
      <p class="eyebrow">01 — The moment</p>
      <h2 id="moment-title" style="display:flex;flex-direction:column;align-items:center;gap:8px;color:#2A1856">
        <span style="font-family:'Poppins',sans-serif;font-weight:300;font-size:64px;line-height:1.1;letter-spacing:-0.01em">It usually starts with</span>
        <span class="ff" style="font-size:168px;line-height:1;color:#2A1856">a <span style="color:#C25BD9">moment.</span></span>
      </h2>
    </div>
    <div class="wrap" aria-hidden="true" style="margin-top:80px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px 48px">
      <figure style="display:flex;flex-direction:column;gap:20px"><img src="images/moment-1.jpg" alt="" style="width:100%;aspect-ratio:4 / 3;object-fit:cover;border-radius:24px;display:block"><p class="ff" style="font-size:40px;line-height:1.1;color:#2A1856">Mom missed her pills again.</p></figure>
      <figure style="display:flex;flex-direction:column;gap:20px"><img src="images/moment-2.jpg" alt="" style="width:100%;aspect-ratio:4 / 3;object-fit:cover;border-radius:24px;display:block"><p class="ff" style="font-size:40px;line-height:1.1;color:#2A1856">Dad fell getting out of the shower.</p></figure>
      <figure style="display:flex;flex-direction:column;gap:20px"><img src="images/moment-3.jpg" alt="" style="width:100%;aspect-ratio:4 / 3;object-fit:cover;border-radius:24px;display:block"><p class="ff" style="font-size:40px;line-height:1.1;color:#2A1856">She hasn't left the house in a week.</p></figure>
      <figure style="display:flex;flex-direction:column;gap:20px"><img src="images/moment-4.jpg" alt="" style="width:100%;aspect-ratio:4 / 3;object-fit:cover;border-radius:24px;display:block"><p class="ff" style="font-size:40px;line-height:1.1;color:#2A1856">You live three hours away.</p></figure>
    </div>
  </sc-if>

  <div class="wrap" style="padding-bottom:128px">
    <div style="margin-top:96px;padding-top:64px;border-top:1px solid #E7E1EE;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:80px;align-items:end">
      <p class="dl" style="color:#2A1856">You don't have to figure this out alone.</p>
      <div style="display:flex;flex-direction:column;gap:16px;align-items:flex-start">
        <p class="lead">We've helped Lowcountry families through moments like these since 2002.</p>
        <a class="link" href="#how-we-help">See how we can help ↓</a>
      </div>
    </div>
  </div>
</section>

<!-- ============ 3. HOW WE HELP ============ -->
<section id="how-we-help" aria-labelledby="house-title">
  <sc-if value="{{live}}" hint-placeholder-val="{{false}}">
    <div data-el="hw-track" style="position:relative;height:{{hwTrackH}}px">
      <div style="position:sticky;top:0;height:{{vh}}px;overflow:hidden;display:flex;align-items:center">
        <div class="wrap" style="display:grid;grid-template-columns:400px minmax(0,1fr);gap:64px;align-items:center;padding-top:96px">
          <div style="display:flex;flex-direction:column;gap:16px">
            <a class="skip sr-only" href="#find-care">Skip to the next section</a>
            <p class="eyebrow">02 — How we help</p>
            <h2 id="house-title" class="h2">Every kind of help, under one roof.</h2>
            <p style="font-size:20px;line-height:1.55">Keep scrolling to see each way we help.</p>
            <div style="position:relative;min-height:300px;margin-top:16px">
              <div class="hcard" data-hcard="0" data-active="true" style="background:#FFFFFF;border:1px solid #E7E1EE;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:12px">
                <h3 class="h3">Personal Care</h3>
                <p>Help with bathing, dressing and getting around — with dignity.</p>
                <p class="sm muted">Also called: help with daily living (ADLs)</p>
                <a class="link" href="/care/personal-care" data-cursor-label="Open">See how we help →</a>
              </div>
              <div class="hcard" data-hcard="1" style="background:#FFFFFF;border:1px solid #E7E1EE;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:12px">
                <h3 class="h3">Home Help</h3>
                <p>Meals, laundry, errands and medication reminders, so the house keeps running.</p>
                <p class="sm muted">Also called: homemaker care</p>
                <a class="link" href="/care/home-help" data-cursor-label="Open">See how we help →</a>
              </div>
              <div class="hcard" data-hcard="2" style="background:#FFFFFF;border:1px solid #E7E1EE;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:12px">
                <h3 class="h3">Companionship</h3>
                <p>Company, conversation and getting out of the house.</p>
                <p class="sm muted">Also called: companion care</p>
                <a class="link" href="/care/companionship" data-cursor-label="Open">See how we help →</a>
              </div>
              <div class="hcard" data-hcard="3" style="background:#FFFFFF;border:1px solid #E7E1EE;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:12px">
                <h3 class="h3">24-Hour &amp; Overnight Care</h3>
                <p>Someone there, day and night.</p>
                <p class="sm muted">Also called: round-the-clock care</p>
                <a class="link" href="/care/24-hour-care" data-cursor-label="Open">See how we help →</a>
              </div>
              <div class="hcard" data-hcard="4" style="background:#FFFFFF;border:1px solid #E7E1EE;border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:12px">
                <h3 class="h3">Respite Care</h3>
                <p>A break for you. Your loved one keeps their routine.</p>
                <p class="sm muted">Also called: respite</p>
                <a class="link" href="/care/respite-care" data-cursor-label="Open">See how we help →</a>
              </div>
            </div>
            <div aria-hidden="true" style="display:flex;align-items:center;gap:10px">
              <span class="tick" data-htick="0" data-on="true"></span><span class="tick" data-htick="1"></span><span class="tick" data-htick="2"></span><span class="tick" data-htick="3"></span><span class="tick" data-htick="4"></span>
              <span data-el="hw-count" class="sm" style="font-weight:600;color:#5B5670;margin-left:8px">1 of 5</span>
            </div>
          </div>
          <div aria-hidden="true" style="position:relative;height:{{collageH}}px">

<section aria-labelledby="cost-title" style="padding:128px 0;background:#FFFFFF">
  <div class="wrap">

        <h2 id="cost-title" class="h2">What will care cost?</h2>
        <p class="lead">Move the sliders for a rough weekly and monthly range. No email, no sign-up.</p>
      </div>
      <p style="display:inline-flex;align-items:center;min-height:36px;padding:0 16px;border-radius:999px;background:#F6EAFB;color:#8E3BA8;font-size:16px;font-weight:700">Illustrative estimate</p>

      <div style="padding:56px;display:flex;flex-direction:column;gap:40px;background:#FFFFFF">
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <label for="hours-slider" style="font-weight:600;color:#2A1856">Hours per visit</label>
            <span style="font-weight:700;color:#2A1856">{{hoursText}}</span>
          </div>
          <div style="position:relative">
            <div aria-hidden="true" style="position:absolute;left:0;right:0;top:20px;height:8px;border-radius:999px;border:1.5px solid #5B5670;overflow:hidden"><div style="height:100%;width:{{hoursPct}}%;background:#2A1856"></div></div>
            <input id="hours-slider" class="dd-range" type="range" min="2" max="24" step="1" value="{{hoursVal}}" aria-valuetext="{{hoursValueText}}" disabled="{{overnight}}" onChange="{{setHours}}">
          </div>
          <div aria-hidden="true" class="sm muted" style="display:flex;justify-content:space-between"><span>2</span><span>24</span></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px">
          <p id="days-label" style="font-weight:600;color:#2A1856">Days per week</p>
          <div role="group" aria-labelledby="days-label" style="display:flex;align-items:center;gap:24px">
            <button type="button" class="iconbtn" aria-label="Fewer days" aria-disabled="{{daysMin}}" onClick="{{fewerDays}}"><svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
            <span aria-live="polite" style="min-width:96px;text-align:center;font-weight:700;font-size:22px;color:#2A1856">{{daysText}}</span>
            <button type="button" class="iconbtn" aria-label="More days" aria-disabled="{{daysMax}}" onClick="{{moreDays}}"><svg aria-hidden="true" focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
          </div>
        </div>
        <div style="display:flex;align-items:flex-start;gap:20px;padding-top:32px;border-top:1px solid #E7E1EE">
          <button type="button" role="switch" class="switch" aria-checked="{{overnightStr}}" aria-labelledby="overnight-label" aria-describedby="overnight-help" onClick="{{toggleOvernight}}" style="background:{{switchBg}};border:{{switchBorder}}">
            <span aria-hidden="true" style="position:absolute;top:4px;left:{{knobLeft}}px;width:24px;height:24px;border-radius:50%;background:{{knobBg}};transition:left 200ms cubic-bezier(0.22,1,0.36,1)"></span>
          </button>
          <div style="display:flex;flex-direction:column;gap:4px">
            <p id="overnight-label" style="font-weight:600;color:#2A1856">Overnight or 24-hour care</p>
            <p id="overnight-help" class="sm muted">Turn on if someone needs to be there overnight or around the clock.</p>
          </div>
        </div>
        <sc-if value="{{pending}}" hint-placeholder-val="{{true}}">
          <p class="sm muted">Visits start at <span class="tbc">[Minimum hours]</span> hours.</p>

<!-- ============ 13. QUESTIONS ============ -->
<section aria-labelledby="faq-title" style="padding:128px 0">
  <div class="wrap" style="display:grid;grid-template-columns:400px minmax(0,1fr);gap:96px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:24px;align-items:flex-start;position:sticky;top:136px">
      <p class="eyebrow">12 — Questions</p>
      <h2 id="faq-title" class="h2">Questions families ask us.</h2>
      <a class="btn btn-ghost" href="/faq" style="margin-top:16px">See all questions</a>
    </div>
    <div style="border-top:1px solid #E7E1EE">
      <div id="home-care-vs-home-health" style="border-bottom:1px solid #E7E1EE">
        <h3><button type="button" class="faq-q" aria-expanded="{{fq0.exp}}" aria-controls="faq-a0" onClick="{{fq0.toggle}}">What's the difference between home care and home health?<svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transform:{{fq0.rot}};transition:transform 360ms cubic-bezier(0.65,0,0.35,1)"><path d="m6 9 6 6 6-6"></path></svg></button></h3>
        <sc-if value="{{fq0.open}}" hint-placeholder-val="{{true}}"><div id="faq-a0" style="padding:0 48px 32px 0"><p style="max-width:65ch">Home care is non-medical help at home: bathing, dressing, meals, housekeeping, company and medication reminders. That's what we do. Home health is medical care from nurses or therapists, usually ordered by a doctor. Many families use both, and we're happy to work alongside your home health team.</p></div></sc-if>
      </div>
      <div id="cost" style="border-bottom:1px solid #E7E1EE">
        <h3><button type="button" class="faq-q" aria-expanded="{{fq1.exp}}" aria-controls="faq-a1" onClick="{{fq1.toggle}}">How much does home care cost?<svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transform:{{fq1.rot}};transition:transform 360ms cubic-bezier(0.65,0,0.35,1)"><path d="m6 9 6 6 6-6"></path></svg></button></h3>
        <sc-if value="{{fq1.open}}" hint-placeholder-val="{{false}}"><div id="faq-a1" style="padding:0 48px 32px 0"><p style="max-width:65ch">It depends on how many hours of help you need. Use our cost estimator for a rough range. Your exact rate is set at your free assessment.</p></div></sc-if>
      </div>
      <div id="medicare" style="border-bottom:1px solid #E7E1EE">
        <h3><button type="button" class="faq-q" aria-expanded="{{fq2.exp}}" aria-controls="faq-a2" onClick="{{fq2.toggle}}">Does Medicare pay for home care?<svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transform:{{fq2.rot}};transition:transform 360ms cubic-bezier(0.65,0,0.35,1)"><path d="m6 9 6 6 6-6"></path></svg></button></h3>
        <sc-if value="{{fq2.open}}" hint-placeholder-val="{{false}}"><div id="faq-a2" style="padding:0 48px 32px 0"><p style="max-width:65ch">Usually not. Medicare generally doesn't cover non-medical home care. Some families use long-term care insurance, VA benefits or Medicaid waiver programs. Ask us which might apply to you.</p></div></sc-if>
      </div>
      <div id="nights-weekends" style="border-bottom:1px solid #E7E1EE">
        <h3><button type="button" class="faq-q" aria-expanded="{{fq3.exp}}" aria-controls="faq-a3" onClick="{{fq3.toggle}}">Can you help at night or on weekends?<svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transform:{{fq3.rot}};transition:transform 360ms cubic-bezier(0.65,0,0.35,1)"><path d="m6 9 6 6 6-6"></path></svg></button></h3>
        <sc-if value="{{fq3.open}}" hint-placeholder-val="{{false}}"><div id="faq-a3" style="padding:0 48px 32px 0"><p style="max-width:65ch">Yes. Care is available 24 hours a day, 7 days a week — a few hours or around the clock. Our office is open Monday to Friday, 8 AM to 5 PM.</p></div></sc-if>
      </div>
      <div id="caregivers" style="border-bottom:1px solid #E7E1EE">
        <h3><button type="button" class="faq-q" aria-expanded="{{fq4.exp}}" aria-controls="faq-a4" onClick="{{fq4.toggle}}">Who will come to my loved one's home?<svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transform:{{fq4.rot}};transition:transform 360ms cubic-bezier(0.65,0,0.35,1)"><path d="m6 9 6 6 6-6"></path></svg></button></h3>
        <sc-if value="{{fq4.open}}" hint-placeholder-val="{{false}}"><div id="faq-a4" style="padding:0 48px 32px 0"><p style="max-width:65ch">An experienced Dawson caregiver chosen for your loved one's needs and schedule. Our team includes Certified Nursing Assistants, and our owner stays involved in every client's care.</p></div></sc-if>
      </div>
      <div id="free-assessment" style="border-bottom:1px solid #E7E1EE">
        <h3><button type="button" class="faq-q" aria-expanded="{{fq5.exp}}" aria-controls="faq-a5" onClick="{{fq5.toggle}}">What happens at the free assessment?<svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A1856" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transform:{{fq5.rot}};transition:transform 360ms cubic-bezier(0.65,0,0.35,1)"><path d="m6 9 6 6 6-6"></path></svg></button></h3>
        <sc-if value="{{fq5.open}}" hint-placeholder-val="{{false}}"><div id="faq-a5" style="padding:0 48px 32px 0"><p style="max-width:65ch">Our owner visits your loved one at home, at no cost. We talk about daily routines, the help they need and what matters most to them. Then we build a care plan together. There's no obligation.</p></div></sc-if>
      </div>
    </div>
  </div>
</section>
